<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub IA - Inteligência Artificial</title>
    
    <!-- estilo da pagina -->
    <!-- a partir de 480px coloca cor verde -->
    <style> 

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;

        }

        body{
            padding: 20px;
            background-color: olive;
            color: white;
            font-family: Arial, sans-serif;
        }

        h1{
            text-align: center;
            margin-bottom: 20px;
        }

        .container{
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .box{
           
            max-width: 400px;
            height: 200px;
            background-color: black;
        }

       
        /* For devices with a minimum width of 768px (Medium) */
        @media screen and (min-width: 768px) {
        body {
            background-color: blue;
            color: white;

            
        } 
        .box {
            width: 356px;
        }

}

        /* For devices with a minimum width of 992px (Large) */
        @media screen and (min-width: 992px) {
        body {
            background-color: tan;
            color: black;

        }
}
    </style>

    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/responsive.css">

</head>
<body>
    <h1>Este é um teste de @media</h1>

    <div class="container">
        
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>

    
</body>
</html>
