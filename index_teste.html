<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub IA - Inteligência Artificial</title>
    
    <!-- estilo da pagina -->
    <!-- a partir de 480px coloca cor verde -->
    <style> 

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;

        }

        body{
            padding: 20px;
            background-color: olive;
            color: white;
            font-family: Arial, sans-serif;
            height: 300vh;
        }

        h1{
            text-align: center;
            margin-bottom: 20px;
        }

        .container{
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .box{
           
            max-width: 400px;
            height: 200px;
            background-color: black;
        }

        .container-position{
            margin-top: 10px;
            width: 100%;
            height: 600px;
            border: 2px solid blueviolet;
            position: relative;
        }

        .filho-tamanho{
            width: 200px;
            height: 200px;
            background-color: rgb(187, 50, 187);
            position: absolute;
        }

        .container-position__filho01{
            top: 0;
            left: 0;
        }

        .container-position__filho02{
            top: 0;
            right: 0;
        }

        .container-position__filho03{
            bottom: 0;
            left: 0;
        }

        .container-position__filho04{
            bottom: 0;
            right: 0;
        }

        .whats{
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background-color: rgb(24, 207, 24);
            border: 2px solid white;
            box-shadow: 1px 2px 2px white;
            position: fixed;
            right: 19px;
            bottom: 15px;
        }



       
        /* For devices with a minimum width of 768px (Medium) */
        @media (min-width: 768px) {
        body {
            background-color: blue;
            color: white;
            
        } 
        .box {
            width: 45%;
            max-width: 600px;
        }

}

        /* For devices with a minimum width of 992px (Large) */
        @media (min-width: 992px) {
        body {
            background-color: tan;
            color: black;

        }

        .box{
            width: 300px;
        }
}
    </style>

    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/responsive.css">

</head>
<body>
    <h1>Este é um teste de @media</h1>

    <div class="container">
        
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>

    <div class="container-position">
        <div class="container-position__filho01 filho-tamanho"></div>
        <div class="container-position__filho02 filho-tamanho"></div>
        <div class="container-position__filho03 filho-tamanho"></div>
        <div class="container-position__filho04 filho-tamanho"></div>
    </div>

    <div class="whats">

    </div>

    
</body>
</html>
